<style>
:root{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,system-ui,sans-serif;color:#242426;background:#f5f5f6;line-height:1.8;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-width:320px}a{color:inherit;text-underline-offset:5px}::selection{background:#f9d7d8;color:#6e191e}:focus-visible{outline:3px solid #c62e32;outline-offset:5px}

footer{max-width:1096px;margin:0 auto;padding:22px 0;display:flex;justify-content:space-between;gap:18px;border-top:1px solid #dedee1;color:#626267;font-size:12px}

@media(max-width:700px){.header-inner{padding:20px 24px}main{padding:32px 20px;min-height:calc(100svh - 160px)}.status-layout{grid-template-columns:minmax(0,1fr);max-width:480px}.status-visual{padding:26px 26px 20px;gap:20px}.status-art{width:100px;height:100px}.status-caption{padding-top:16px}.status-body{padding:30px 26px 34px}h1{font-size:27px}.description{font-size:15px}.primary{width:100%;margin-top:26px}.guidance{margin-top:20px}footer{margin-inline:20px;padding-block:18px;flex-wrap:wrap}}
